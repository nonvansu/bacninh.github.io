<style>
/* LIQUID GLASS CHUẨN ĐẸP CHO BẮC NINH */
.glass{
  position:relative;
  background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 100%);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.22);
  border-top: 1px solid rgba(255,255,255,0.4);
  border-left: 1px solid rgba(255,255,255,0.25);
  border-radius: 20px;
  padding: 14px 18px;
  font-size: 13.5px;
  line-height: 1.5;
  color: rgba(255,255,255,0.92);
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.4),
    inset 0 -1px 0 rgba(0,0,0,0.15),
    0 0 0 1px rgba(247,216,138,0.08);
  opacity:0;
  transform:translateX(60px) scale(0.96);
  transition: all .9s cubic-bezier(.16,1,.3,1);
  overflow:hidden;
}
.glass::before{
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
  opacity:0.7;
}
.glass::after{
  content:'';
  position:absolute;
  top:-50%; left:-50%;
  width:200%; height:200%;
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.15) 0%, transparent 50%);
  pointer-events:none;
}
.glass.show{
  opacity:1;
  transform:translateX(0) scale(1);
}
.glass:hover{
  background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.08) 100%);
  border-color: rgba(247,216,138,0.35);
  box-shadow: 
    0 12px 40px rgba(0,0,0,0.4),
    0 0 20px rgba(247,216,138,0.15),
    inset 0 1px 0 rgba(255,255,255,0.5);
  transform:translateX(0) scale(1.02);
}

/* RIÊNG CHO NỀN SÁNG (Danh lam, Kết luận) */
.danhlam .glass, #ketluan .glass{
  background: linear-gradient(135deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.6) 100%);
  border: 1px solid rgba(140,21,21,0.15);
  color:#2a1400;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.9);
}

/* NÚT MÙA CŨNG LIQUID LUÔN */
.mua-btns button{
  background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
  backdrop-filter: blur(16px) saturate(150%);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:22px;
  padding:9px 18px;
  transition:all .4s cubic-bezier(.16,1,.3,1);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.2);
}
.mua-btns button:hover{
  transform:translateY(-2px) scale(1.05);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3), 0 0 12px rgba(247,216,138,0.2);
}
.mua-btns button.active{
  background: linear-gradient(135deg, #f7d88a 0%, #d4a24e 100%);
  color:#000;
  font-weight:800;
  border-color: rgba(247,216,138,0.8);
  box-shadow: 0 8px 24px rgba(247,216,138,0.35), inset 0 1px 0 rgba(255,255,255,0.8);
}
</style>
